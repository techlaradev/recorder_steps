<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚜️ Orchestrator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ──────────────────────────────────────────────────────────── */
    :root {
      --c-primary:    #A100FF;
      --c-hover:      #8700D4;
      --c-tab:        #D966FF;
      --c-bg:         #120023;
      --c-sidebar:    #1E0038;
      --c-surface:    #2A0050;
      --c-border:     #5A0099;
      --c-text:       #ECDEFF;
      --c-title:      #FFF8E7;
      --c-placeholder:#9A70C4;

      --r-btn:        10px;
      --r-card:       14px;
      --r-pill:       50px;
    }

    /* ── Base ────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Graphik', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: .875rem;
      font-weight: 400;
      color: var(--c-text);
      background: var(--c-bg);
      min-height: 100vh;
    }

    h1 { font-weight: 700; letter-spacing: -.03em; color: var(--c-title); }
    h2, h3 { font-weight: 600; letter-spacing: -.02em; color: var(--c-title); }
    h4, h5, h6 { font-weight: 600; color: var(--c-title); }

    p, span, div { color: var(--c-text); }

    a { color: var(--c-primary); }
    a:hover { color: var(--c-hover); }

    code {
      color: var(--c-tab);
      background: rgba(161,0,255,.12);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: .7rem;
    }

    /* ── Navbar ──────────────────────────────────────────────────────────── */
    .navbar {
      background: var(--c-sidebar) !important;
      border-bottom: 1px solid var(--c-border);
      padding: 12px 24px;
    }
    .navbar-brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--c-title) !important;
    }

    /* ── Card ────────────────────────────────────────────────────────────── */
    .card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-card);
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    .card-body { padding: 2rem; }

    /* ── Stepper ─────────────────────────────────────────────────────────── */
    .stepper { display: flex; margin-bottom: 24px; gap: 4px; }
    .stepper-item {
      flex: 1; text-align: center;
      font-size: .75rem; font-weight: 500;
      padding: 8px 4px;
      color: var(--c-placeholder);
      border-bottom: 3px solid var(--c-surface);
      transition: color .2s, border-color .2s;
    }
    .stepper-item.active {
      color: var(--c-primary);
      border-color: var(--c-primary);
    }
    .stepper-item.done {
      color: var(--c-tab);
      border-color: var(--c-tab);
    }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn {
      font-weight: 500;
      font-size: .875rem;
      border-radius: var(--r-btn);
      padding: 10px 20px;
      transition: background .15s, box-shadow .15s;
    }
    .btn-primary {
      background: var(--c-primary);
      border-color: var(--c-primary);
      color: #fff;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--c-hover);
      border-color: var(--c-hover);
      color: #fff;
      box-shadow: 0 0 0 3px rgba(161,0,255,.3);
    }
    .btn-warning {
      background: #c47900;
      border-color: #c47900;
      color: #fff;
    }
    .btn-warning:hover { background: #a36500; border-color: #a36500; color:#fff; }
    .btn-success {
      background: #0d7a4e;
      border-color: #0d7a4e;
      color: #fff;
    }
    .btn-success:hover { background: #096040; border-color: #096040; color:#fff; }
    .btn-outline-light {
      color: var(--c-text);
      border-color: var(--c-border);
      font-size: .8rem;
      padding: 6px 14px;
    }
    .btn-outline-light:hover {
      background: var(--c-surface);
      color: var(--c-title);
    }
    .btn-outline-secondary {
      color: var(--c-placeholder);
      border-color: var(--c-border);
    }
    .btn-outline-secondary:hover {
      background: var(--c-surface);
      color: var(--c-text);
    }

    /* ── Inputs ──────────────────────────────────────────────────────────── */
    .form-control, .form-select {
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      color: var(--c-text);
      border-radius: var(--r-btn);
      padding: 10px 14px;
      font-size: .875rem;
    }
    .form-control::placeholder { color: var(--c-placeholder); }
    .form-control:focus, .form-select:focus {
      background: var(--c-bg);
      border-color: var(--c-primary);
      color: var(--c-text);
      box-shadow: 0 0 0 3px rgba(161,0,255,.25);
      outline: none;
    }
    .form-label {
      font-weight: 500;
      font-size: .875rem;
      color: var(--c-text);
      margin-bottom: 6px;
    }
    .form-text {
      color: var(--c-placeholder);
      font-size: .7rem;
      margin-top: 5px;
    }

    /* ── Form check / toggle ─────────────────────────────────────────────── */
    .form-check-input {
      background-color: var(--c-surface);
      border-color: var(--c-border);
      cursor: pointer;
    }
    .form-check-input:checked {
      background-color: var(--c-primary);
      border-color: var(--c-primary);
    }
    .form-check-input:focus {
      box-shadow: 0 0 0 3px rgba(161,0,255,.25);
    }
    .form-check-label { color: var(--c-text); cursor: pointer; }

    /* ── Tabs ────────────────────────────────────────────────────────────── */
    .nav-tabs { border-color: var(--c-border); gap: 4px; }
    .nav-tabs .nav-link {
      color: var(--c-placeholder);
      border-radius: var(--r-btn) var(--r-btn) 0 0;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: .8rem;
      padding: 8px 16px;
    }
    .nav-tabs .nav-link:hover { color: var(--c-text); border-color: var(--c-border); }
    .nav-tabs .nav-link.active {
      background: var(--c-surface);
      border-color: var(--c-border) var(--c-border) var(--c-surface);
      color: var(--c-primary);
    }
    .tab-content { padding-top: 20px; }

    /* ── Alerts ──────────────────────────────────────────────────────────── */
    .alert {
      border-radius: var(--r-btn);
      font-size: .875rem;
    }
    .alert-success {
      background: rgba(13,122,78,.15);
      border-color: rgba(13,122,78,.4);
      color: #6fffc4;
    }
    .alert-danger {
      background: rgba(220,53,69,.15);
      border-color: rgba(220,53,69,.35);
      color: #ff8fa3;
    }
    .alert-warning {
      background: rgba(196,121,0,.15);
      border-color: rgba(196,121,0,.35);
      color: #ffc75f;
    }
    .alert-info, .alert-light {
      background: var(--c-surface);
      border-color: var(--c-border);
      color: var(--c-text);
    }

    /* ── HR ──────────────────────────────────────────────────────────────── */
    hr { border-color: var(--c-border); opacity: 1; margin: 20px 0; }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    .spinner-border.text-primary,
    .spinner-border { color: var(--c-primary) !important; }
    .spinner-grow.text-danger { color: var(--c-tab) !important; }

    /* ── Status pill ─────────────────────────────────────────────────────── */
    .badge-pill {
      border-radius: var(--r-pill);
      font-size: .7rem;
      font-weight: 500;
      padding: 4px 10px;
    }

    /* ── Pre / code block ────────────────────────────────────────────────── */
    pre {
      background: #0A0015 !important;
      color: var(--c-text) !important;
      border: 1px solid var(--c-border);
      border-radius: var(--r-card);
      font-size: .7rem;
      line-height: 1.6;
    }

    /* ── Loading overlay ─────────────────────────────────────────────────── */
    .loading-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(18,0,35,.85);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backdrop-filter: blur(4px);
    }
    .loading-overlay.show { display: flex; }
    .loading-overlay p { color: var(--c-placeholder); font-size: .875rem; margin: 0; }

    /* ── Misc ────────────────────────────────────────────────────────────── */
    .text-muted { color: var(--c-placeholder) !important; }
    .fw-semibold { font-weight: 600 !important; }
    .small { font-size: .75rem !important; }
    .border { border-color: var(--c-border) !important; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar mb-4">
  <span class="navbar-brand">⚜️ Orchestrator</span>
  <div style="display:flex; gap:8px; align-items:center;">
    <a href="/mapa"    class="btn btn-outline-light btn-sm">📚 Biblioteca</a>
    <a href="/library" class="btn btn-outline-light btn-sm">📸 Evidências</a>
    <a href="/reset"   class="btn btn-outline-light btn-sm">↩ Reiniciar</a>
  </div>
</nav>

<!-- Container -->
<div class="container" style="max-width: {% block max_width %}660px{% endblock %};">

  <!-- Stepper -->
  <div class="stepper">
    {% for s in steps %}
    <div class="stepper-item {{ s.state }}">{{ s.label }}</div>
    {% endfor %}
  </div>

  <!-- Card principal -->
  <div class="card">
    <div class="card-body">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>

<!-- Loading overlay (Ollama pode demorar) -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner-border" style="width:3rem;height:3rem;"></div>
  <p>Processando com IA… isso pode levar alguns minutos.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelectorAll('form[data-loading]').forEach(f => {
    f.addEventListener('submit', () => {
      document.getElementById('loadingOverlay').classList.add('show');
    });
  });


</script>
{% block scripts %}{% endblock %}
</body>
</html>
